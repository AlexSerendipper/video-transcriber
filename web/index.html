<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地视频转文字</title>
    <link rel="stylesheet" href="/styles.css?v=20260728-3" />
  </head>
  <body>
    <main class="app-shell history-collapsed">
      <aside id="historyPanel" class="history-panel" aria-hidden="true">
        <div class="history-head">
          <div>
            <p class="kicker">Local Archive</p>
            <h2>历史记录</h2>
          </div>
          <div class="history-head-actions">
            <button id="closeHistoryBtn" class="icon-button" type="button" title="收起历史" aria-label="收起历史">‹</button>
            <button id="refreshHistoryBtn" class="icon-button" type="button" title="刷新历史" aria-label="刷新历史">↻</button>
          </div>
        </div>

        <div class="history-body">
          <label class="history-search" for="historySearchInput">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
            <input id="historySearchInput" type="search" placeholder="搜索视频文件名" autocomplete="off" />
          </label>
          <div id="historyList" class="history-list empty" aria-label="历史记录列表">暂无历史文件</div>
        </div>
      </aside>

      <button
        id="historyBackdrop"
        class="history-backdrop"
        type="button"
        aria-label="关闭历史记录"
        hidden
      ></button>

      <section class="main-panel">
        <section class="topbar">
          <div>
            <p class="kicker">Local Transcript</p>
            <div class="title-row">
              <button
                id="openHistoryBtn"
                class="history-trigger"
                type="button"
                title="打开历史记录"
                aria-label="打开历史记录"
                aria-controls="historyPanel"
                aria-expanded="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                  <path d="M3 4v5h5"></path>
                  <path d="M12 7v5l3 2"></path>
                </svg>
              </button>
              <h1>视频转文字</h1>
            </div>
          </div>
          <div class="controls">
            <select id="preset" aria-label="识别模式">
              <option value="fast" selected>速度优先</option>
              <option value="balanced">平衡</option>
              <option value="accurate">准确优先</option>
            </select>
            <input id="fileInput" class="visually-hidden" type="file" accept="video/*,audio/*" />
            <button id="importBtn" type="button">导入视频</button>
            <button id="startBtn" type="button" disabled>开始转写</button>
          </div>
        </section>

        <section class="workspace">
          <div class="player-panel">
            <video id="video" controls preload="metadata"></video>
          </div>
          <div id="splitter" class="splitter" role="separator" aria-label="调整视频和文字区域宽度" aria-orientation="vertical"></div>
          <article class="transcript-panel">
            <div class="transcript-head">
              <h2>文字稿</h2>
              <span id="wordCount">0 字</span>
            </div>
            <div class="transcript-viewport">
              <div id="transcript" class="transcript empty">请先导入视频</div>
              <section id="transcriptionProgress" class="transcription-progress" hidden aria-live="polite">
                <div class="progress-copy">
                  <strong id="statusText">正在准备转写</strong>
                  <span id="progressValue">0%</span>
                </div>
                <div class="progress" aria-hidden="true">
                  <div id="progressBar"></div>
                </div>
                <button id="cancelBtn" type="button">终止转写</button>
              </section>
            </div>
          </article>
        </section>
      </section>
    </main>
    <script src="/app.js?v=20260728-3"></script>
  </body>
</html>
